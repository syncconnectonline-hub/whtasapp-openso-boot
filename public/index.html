<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sync Connect · WhatsApp</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { font: 15px system-ui; color: #202c33; background: #e9edef; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; }
    .app { width: min(1200px,100%); height: min(820px,100vh); background: white; display: grid; grid-template-columns: 340px 1fr; box-shadow: 0 10px 40px #0002; }
    .side { border-right: 1px solid #ddd; display: flex; flex-direction: column; min-height: 0; }
    .brand { background: #075e54; color: white; padding: 18px; font-size: 18px; font-weight: 650; }
    .status { padding: 10px 16px; background: #f0f2f5; color: #52616b; font-size: 13px; }
    .settings { padding: 12px; border-bottom: 1px solid #eee; font-size: 12px; color: #52616b; }
    .settings input { width: 100%; margin: 7px 0; padding: 9px; border: 1px solid #ccc; border-radius: 5px; }
    .settings button,.alerts button { border: 0; padding: 8px 12px; border-radius: 6px; background: #128c7e; color: white; cursor: pointer; }
    .alerts { background: #fff3cd; color: #664d03; padding: 10px 14px; max-height: 180px; overflow: auto; }
    .alertrow { padding: 7px 0; border-top: 1px solid #ead99b; }
    .alertrow button { padding: 4px 8px; margin-left: 5px; }
    .list { overflow: auto; }
    .chat { padding: 14px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
    .chat:hover,.chat.active { background: #f0f2f5; }
    .chat small { display: block; color: #667781; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main { display: flex; flex-direction: column; background: #efeae2; min-height: 0; }
    .top { padding: 15px; background: #f0f2f5; min-height: 58px; font-weight: 600; }
    .messages { flex: 1; padding: 24px; overflow: auto; display: flex; flex-direction: column; gap: 9px; }
    .bubble { max-width: 75%; padding: 9px 12px; border-radius: 8px; background: white; align-self: flex-start; white-space: pre-wrap; }
    .bubble.bot,.bubble.human { align-self: flex-end; background: #d9fdd3; }
    .compose { display: flex; gap: 8px; padding: 12px; background: #f0f2f5; }
    .compose input { flex: 1; border: 0; border-radius: 20px; padding: 13px; }
    .compose button { border: 0; padding: 10px 14px; border-radius: 8px; background: #128c7e; color: white; cursor: pointer; }
    .empty { margin: auto; text-align: center; color: #667781; max-width: 400px; padding: 25px; }
    .qr { background: white; padding: 10px; display: block; width: 220px; margin: 15px auto; }
    @media(max-width:700px) { body { display: block; } .app { height: 100vh; grid-template-columns: 42% 58%; } .bubble { max-width: 90%; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">SYNC CONNECT · Inbox</div>
      <div id="status" class="status">Conectando…</div>
      <div class="settings">
        <label for="apiKey">Clave de OpenAI (se guarda solo en este computador)</label>
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…">
        <button id="saveKey" type="button">Guardar clave</button>
        <span id="keyStatus">pendiente</span>
      </div>
      <div id="alerts" class="alerts" hidden></div>
      <div id="chats" class="list"></div>
    </aside>
    <main class="main">
      <header id="title" class="top">Asistente de atención</header>
      <section id="messages" class="messages"><div class="empty">Cuando aparezca el QR, escanéalo desde WhatsApp → Dispositivos vinculados.</div></section>
      <form id="form" class="compose"><input id="reply" placeholder="Escribe una respuesta manual…" autocomplete="off"><button>Enviar</button></form>
    </main>
  </div>
  <script>
    const socket = io();
    let state = { chats: [], unreadQuestions: [] }, selected = null;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(s) {
      state = s;
      document.querySelector('#status').textContent = s.waStatus;
      document.querySelector('#keyStatus').textContent = s.apiConfigured ? '✓ configurada' : 'pendiente';
      const chats = document.querySelector('#chats'); chats.innerHTML = '';
      if (s.currentQr) chats.innerHTML = `<div style="padding:10px;text-align:center">Escanea desde WhatsApp → Dispositivos vinculados<img class="qr" src="${s.currentQr}"></div>`;
      for (const c of [...s.chats].sort((a,b) => b.updatedAt-a.updatedAt)) {
        const el = document.createElement('div'); el.className = 'chat' + (selected === c.id ? ' active' : '');
        el.innerHTML = `<b>${esc(c.name)}</b><small>${esc(c.messages.at(-1)?.text || '')}</small>`;
        el.onclick = () => { selected = c.id; render(state); }; chats.append(el);
      }
      const alerts = document.querySelector('#alerts'); alerts.hidden = !s.unreadQuestions.length;
      alerts.innerHTML = s.unreadQuestions.map(a => `<div class="alertrow"><b>Requiere respuesta · ${esc(a.name)}</b><br>${esc(a.question)} <button onclick="dismiss('${esc(a.id)}')">Atendido</button></div>`).join('');
      const chat = s.chats.find(c => c.id === selected);
      document.querySelector('#title').textContent = chat ? chat.name : 'Asistente de atención';
      const box = document.querySelector('#messages');
      box.innerHTML = chat ? chat.messages.map(m => `<div class="bubble ${esc(m.from)}">${esc(m.text)}</div>`).join('') : (s.currentQr ? '<div class="empty">Escanea el QR y mantén abierta esta página para ver chats y alertas.</div>' : '<div class="empty">Selecciona una conversación de la izquierda.</div>');
      box.scrollTop = box.scrollHeight;
    }
    function dismiss(id) { socket.emit('dismiss-alert', id); }
    socket.on('state', render);
    socket.on('needs-human', a => {
      if (Notification.permission === 'granted') new Notification('Sync Connect: consulta pendiente', { body: `${a.name}: ${a.question}` });
      else if (Notification.permission === 'default') Notification.requestPermission();
    });
    document.querySelector('#saveKey').onclick = async () => {
      const input = document.querySelector('#apiKey'), label = document.querySelector('#keyStatus');
      label.textContent = 'guardando…';
      try {
        const r = await fetch('/api/settings/openai', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({apiKey: input.value}) });
        const result = await r.json(); if (!r.ok) throw new Error(result.error);
        input.value = ''; label.textContent = '✓ configurada';
      } catch (e) { label.textContent = e.message; }
    };
    document.querySelector('#form').onsubmit = e => {
      e.preventDefault(); const input = document.querySelector('#reply'), chat = state.chats.find(c => c.id === selected);
      if (chat && input.value.trim()) { socket.emit('send-manual', {jid: chat.id, text: input.value}); input.value = ''; }
    };
  </script>
</body>
</html>
