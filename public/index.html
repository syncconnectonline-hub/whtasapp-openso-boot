<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sync Connect · CRM</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#13243a;background:#f4f7fb;font-synthesis:none;font-weight:450;--navy:#101d32;--navy2:#172840;--teal:#18b899;--teal-dark:#079879;--blue:#4769df;--ink:#13243a;--muted:#718198;--line:#e5ebf3;--panel:#fff;--soft:#f4f7fb;--shadow:0 10px 30px #1528440b}
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.shell{height:100dvh;display:grid;grid-template-columns:228px minmax(0,1fr);overflow:hidden}
.sidebar{background:var(--navy);color:#d3dceb;display:flex;flex-direction:column;min-width:0;padding:18px 12px 14px;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:1px 8px 23px}
.brandmark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#21c9a2,#0ca887);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:800;box-shadow:0 7px 18px #14b89640}
.brandtitle{font-size:14px;font-weight:750;color:white;letter-spacing:.01em}
.brandtitle small{display:block;margin-top:3px;color:#8fa1b9;font-size:9px;font-weight:700;letter-spacing:.12em}
.workspace{padding:0 10px 8px;color:#72849e;font-size:9px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:5px}
.navbtn{border:0;background:transparent;color:#aab8ca;border-radius:11px;min-height:44px;width:100%;padding:0 12px;display:flex;align-items:center;gap:12px;text-align:left;font-size:12px;font-weight:600;transition:background .15s,color .15s}
.navbtn:hover{background:#ffffff0c;color:#fff}
.navbtn.active{background:#18354b;color:#35d3b1}
.navicon{width:18px;height:18px;flex:none;display:grid;place-items:center}
.navicon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navtext{white-space:nowrap}
.navcount{margin-left:auto;min-width:19px;padding:2px 5px;border-radius:20px;background:#f1a348;color:#172840;font-size:10px;text-align:center;font-weight:800}
.sidebar-spacer{flex:1;min-height:10px}
.connection{border:1px solid #31435b;border-radius:12px;padding:11px 10px;margin:8px 4px 10px;display:flex;align-items:center;gap:8px;font-size:10px;color:#a8b7ca}
.dot{height:8px;width:8px;background:#f2b546;border-radius:50%;box-shadow:0 0 0 3px #f2b54620;flex:none}
.dot.ok{background:#20cb9f;box-shadow:0 0 0 3px #20cb9f22}
.dot.bad{background:#ee7078;box-shadow:0 0 0 3px #ee707822}
.side-foot{padding:0 4px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.topbar{height:74px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:17px;padding:0 24px}
.titleblock{min-width:180px}
.titleblock h1{font-size:17px;margin:0;font-weight:750;letter-spacing:-.02em}
.titleblock p{font-size:11px;color:var(--muted);margin:4px 0 0}
.searchbox{margin-left:auto;width:min(320px,34vw);height:38px;display:flex;align-items:center;gap:9px;background:#f5f7fb;border:1px solid #e8edf4;border-radius:10px;padding:0 12px;color:#8795a9}
.searchbox input{border:0;background:transparent;outline:0;width:100%;font-size:11px;color:var(--ink)}
.searchbox input::placeholder{color:#94a1b2}
.iconbtn,.avatarbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#65758c;display:grid;place-items:center;flex:none}
.iconbtn:hover,.avatarbtn:hover{border-color:#bdd2d5;color:var(--teal-dark)}
.avatarbtn{border:0;border-radius:50%;background:#e3f7f2;color:#108c73;font-size:11px;font-weight:800}
.top-status{display:flex;align-items:center;gap:7px;padding:0 4px;font-size:10px;color:#60728b;white-space:nowrap}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:22px 24px 24px;scrollbar-width:thin;scrollbar-color:#cdd7e3 transparent}
.content::-webkit-scrollbar{width:7px}
.content::-webkit-scrollbar-thumb{background:#d2dbe6;border-radius:9px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
.pagehead h2{font-size:18px;margin:0;font-weight:760;letter-spacing:-.025em}
.pagehead p{font-size:11px;color:var(--muted);margin:5px 0 0}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:#788ba2;margin-bottom:7px}
.btn{border:1px solid var(--line);background:white;color:#32465f;border-radius:9px;padding:9px 12px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:#b8d0d0;box-shadow:0 4px 12px #25465410}
.btn.primary{background:var(--teal-dark);border-color:var(--teal-dark);color:white}
.btn.primary:hover{background:#07876b}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:#c74753;background:#fff7f7;border-color:#f2d4d6}
.btn.small{padding:7px 9px;font-size:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.cardpad{padding:17px}
.cardtitle{font-weight:750;font-size:12px;margin:0}
.carddesc{color:var(--muted);font-size:10px;margin:5px 0 0;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:14px}
.stat{padding:15px 16px;position:relative;overflow:hidden}
.statlabel{color:#76869a;font-size:10px;font-weight:600}
.statvalue{font-size:25px;font-weight:780;margin-top:9px;letter-spacing:-.04em}
.statfoot{font-size:9px;color:#8d9aac;margin-top:4px}
.stat-icon{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#e9f8f4;color:#0a9a7d;font-size:15px;font-weight:800}
.overview-grid{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(260px,.9fr);gap:14px}
.qr-card{min-height:267px;display:flex;align-items:center;gap:20px;padding:19px}
.qr-copy{flex:1;min-width:0}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;background:#f3f6fa;border-radius:30px;color:#5f7188;font-size:9px;font-weight:700}
.status-pill.connected{background:#e8faf4;color:#0a8c6d}
.status-pill.pending{background:#fff5e8;color:#a56516}
.qr-note{font-size:11px;color:#708097;line-height:1.6;margin:12px 0 15px;max-width:280px}
.qr-box{width:170px;height:170px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px dashed #d5dfea;background:#fbfcfe;color:#9aa9ba;text-align:center;font-size:10px;padding:12px}
.qr-box img{width:152px;height:152px;object-fit:contain;border-radius:8px;background:#fff}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.listrow{display:flex;align-items:center;gap:10px;min-width:0;padding:11px 0;border-bottom:1px solid #eef1f5}
.listrow:last-child{border-bottom:0}
.person-avatar{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#e9effb;color:#4769d6;font-size:10px;font-weight:800;flex:none}
.listcopy{min-width:0;flex:1}
.listcopy strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listcopy small{font-size:9px;color:#8593a5;display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowtime{color:#98a4b4;font-size:9px;white-space:nowrap}
.empty-state{padding:28px 15px;text-align:center;color:#8b9aae;font-size:10px;line-height:1.6}
.link-preview{background:#f3f8f8;border:1px solid #e0efed;border-radius:10px;padding:12px;margin-top:12px}
.link-preview strong{font-size:10px;display:block}
.link-preview a{font-size:10px;color:#078c72;display:block;margin-top:5px;word-break:break-word}
.inbox{height:100%;min-height:420px;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px}
.chat-list-card,.conversation-card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.inbox-search{margin:12px 13px 5px;height:34px}
.chat-list{overflow:auto;flex:1;padding:3px 8px 8px}
.chat-item{display:flex;gap:9px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.chat-item:hover{background:#f6f8fb}
.chat-item.active{background:#eaf7f4;border-color:#d2eee7}
.chat-item .person-avatar{width:36px;height:36px}
.chat-meta{display:flex;justify-content:space-between;gap:6px}
.chat-meta strong{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta small{font-size:8px;color:#8b98a9}
.chat-item .listcopy small{max-width:180px}
.conversation-head{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid var(--line);background:#fff}
.conversation-head .listcopy{flex:1}
.conversation-head .listcopy strong{font-size:11px}
.conversation-head .listcopy small{font-size:9px}
.message-area{flex:1;min-height:0;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#f7f9fc,#f4f7fb)}
.bubble{max-width:min(76%,520px);border:1px solid #e7edf3;border-radius:12px 12px 12px 3px;background:#fff;padding:9px 12px;font-size:10px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 4px #19325008}
.bubble.bot,.bubble.human{align-self:flex-end;background:#e8f8f3;border-color:#d5eee6;border-radius:12px 12px 3px 12px}
.bubble-time{display:block;text-align:right;color:#98a5b4;font-size:8px;margin-top:4px}
.compose{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;flex:none}
.compose input{flex:1;min-width:0;height:37px;border:1px solid var(--line);border-radius:9px;padding:0 12px;outline:0;font-size:10px}
.compose input:focus,.field input:focus,.field textarea:focus{border-color:#5ac7ad;box-shadow:0 0 0 3px #1eb99515}
.quickbar{display:flex;gap:6px;padding:8px 12px 0;flex:none;background:#fff}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.stage-col{background:#edf1f6;border:1px solid #e3e9f0;border-radius:13px;padding:11px;min-width:0;min-height:340px}
.stage-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 10px}
.stage-head strong{font-size:10px}
.stage-count{background:#fff;border-radius:20px;padding:3px 7px;font-size:9px;color:#738299}
.lead-card{padding:11px;background:#fff;border:1px solid #e3eaf2;border-radius:11px;margin-bottom:8px;cursor:pointer}
.lead-card:hover{border-color:#b9ded5;transform:translateY(-1px)}
.lead-card strong{font-size:10px;display:block}
.lead-card p{font-size:9px;color:#7b899c;margin:6px 0 8px;line-height:1.4}
.lead-foot{display:flex;align-items:center;justify-content:space-between;gap:5px}
.stage-chip{font-size:8px;background:#edf7f4;color:#07866d;border-radius:20px;padding:4px 7px}
.stage-select{border:0;background:#f4f6f9;color:#68788d;border-radius:6px;padding:4px;font-size:8px;max-width:100%}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.contact-edit{position:relative}.contact-edit summary{cursor:pointer;color:#087e68;font-size:9px;font-weight:700;list-style:none}.contact-edit summary::-webkit-details-marker{display:none}.contact-edit[open] summary{margin-bottom:7px}.contact-edit form{display:grid;gap:6px;min-width:170px}.contact-edit input,.contact-edit textarea{border:1px solid var(--line);border-radius:6px;padding:6px;font-size:9px;max-width:210px}.contact-edit textarea{min-height:48px;resize:vertical}
table{width:100%;border-collapse:collapse;min-width:610px}
th{text-align:left;padding:11px 14px;background:#f8fafc;color:#8190a2;font-size:9px;font-weight:750;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
td{padding:11px 14px;font-size:10px;border-bottom:1px solid #edf1f5;vertical-align:middle}
tr:last-child td{border-bottom:0}
.contact-name{display:flex;align-items:center;gap:9px;font-weight:700}
.contact-name .person-avatar{height:30px;width:30px}
.stage-tag{border-radius:20px;background:#eef3fb;color:#536b97;padding:5px 8px;font-size:8px;white-space:nowrap}
.pending-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.question-card{padding:15px}
.question-top{display:flex;align-items:center;gap:9px}
.question-text{font-size:11px;line-height:1.55;color:#364a61;margin:13px 0}
.question-actions{display:flex;gap:7px;flex-wrap:wrap}
.settings-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr);gap:14px;align-items:start}
.settings-card{padding:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:9px;color:#64758a;font-weight:750}
.field input,.field textarea,.field select{width:100%;border:1px solid #dfe6ee;border-radius:8px;background:#fff;padding:9px 10px;outline:0;color:#253850;font-size:10px}
.field textarea{resize:vertical;min-height:67px;line-height:1.5}
.field textarea.long{min-height:104px}
.field .hint{font-size:8px;color:#99a5b4;line-height:1.45}
.keybox{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.checkbox{display:flex;align-items:center;gap:7px;font-size:9px;color:#65768c}
.checkbox input{width:14px;height:14px;accent-color:#0c9e7d}
.form-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}
.form-note{font-size:9px;color:#8795a8}
.settings-side{display:flex;flex-direction:column;gap:12px}
.conn-card{padding:16px}
.conn-card .qr-wrap{display:flex;align-items:center;gap:14px;margin-top:12px}
.conn-card .qr-box{width:126px;height:126px}
.conn-card .qr-box img{width:112px;height:112px}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eef1f5;font-size:9px}
.info-row:last-child{border-bottom:0}
.info-row span{color:#8593a6}
.info-row strong{text-align:right;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;right:20px;bottom:18px;z-index:10;padding:11px 15px;background:#122239;color:white;border-radius:10px;box-shadow:0 10px 30px #0e223833;font-size:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#a93d48}
.qr-placeholder{font-size:9px;line-height:1.5}
.top-actions{display:flex;align-items:center;gap:8px}
@media(max-width:980px){.shell{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:14px 8px}.brand{justify-content:center;padding:0 0 21px}.brandtext,.workspace,.navtext,.connection span:last-child{display:none}.navbtn{justify-content:center;padding:0}.navcount{position:absolute;margin:0 0 25px 24px;min-width:15px;padding:1px 4px;font-size:8px}.connection{justify-content:center;margin:8px 1px}.topbar{padding:0 17px}.content{padding:18px}.titleblock{min-width:150px}}
@media(max-width:760px){.topbar{height:65px;gap:9px}.titleblock{min-width:0;flex:1}.titleblock h1{font-size:15px}.titleblock p,.top-status{display:none}.searchbox{width:min(190px,33vw);margin-left:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px}.statvalue{font-size:22px}.overview-grid,.settings-grid{grid-template-columns:1fr}.qr-card{min-height:220px}.inbox{grid-template-columns:minmax(185px,38%) minmax(0,1fr);gap:8px}.conversation-head{padding:0 9px}.conversation-head .btn{padding:7px;font-size:8px}.message-area{padding:12px}.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}.stage-col{min-height:230px}.pending-list{grid-template-columns:1fr}}
@media(max-width:520px){.shell{grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:12px 5px}.brandmark{width:34px;height:34px}.navbtn{min-height:41px}.topbar{padding:0 10px}.searchbox{width:34vw;height:34px}.iconbtn,.avatarbtn{width:33px;height:33px}.content{padding:13px}.pagehead{align-items:flex-start;flex-direction:column;margin-bottom:13px}.overview-grid{gap:10px}.qr-card{padding:13px;gap:10px;flex-direction:column;align-items:stretch}.qr-box{width:100%;height:150px}.qr-box img{height:134px;width:134px}.inbox{height:100%;min-height:0;grid-template-columns:minmax(0,35%) minmax(0,1fr);gap:6px}.chat-item{padding:8px 5px;gap:6px}.chat-item .person-avatar{width:28px;height:28px}.chat-meta small{display:none}.chat-meta strong{font-size:9px}.inbox-search{margin:9px 7px 3px}.chat-list{padding:2px 4px}.conversation-head{gap:6px}.conversation-head .person-avatar{width:29px;height:29px}.conversation-head .listcopy small{display:none}.conversation-head .btn{font-size:0;min-width:31px}.compose{padding:8px 6px;gap:5px}.compose input{padding:0 8px}.quickbar{padding:7px 6px 0}.quickbar .btn{padding:6px;font-size:8px}.bubble{max-width:92%;font-size:9px}.kanban{grid-template-columns:1fr 1fr;gap:7px}.stage-col{padding:7px;min-height:180px}.lead-card{padding:8px}.stage-select{font-size:7px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.settings-card{padding:13px}.settings-side{grid-template-columns:1fr}.top-actions{gap:5px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">S</div><div class="brandtext"><div class="brandtitle">Sync Connect<small>CRM WHATSAPP</small></div></div></div>
    <div class="workspace">Espacio de trabajo</div>
    <nav class="nav" id="nav">
      <button class="navbtn active" data-page="overview"><span class="navicon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span><span class="navtext">Resumen</span></button>
      <button class="navbtn" data-page="inbox"><span class="navicon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 13h4l2 3h4l2-3h4"/></svg></span><span class="navtext">Bandeja</span></button>
      <button class="navbtn" data-page="pipeline"><span class="navicon"><svg viewBox="0 0 24 24"><path d="M4 19V5h16v14"/><path d="M9 5v14M15 5v14"/></svg></span><span class="navtext">Pipeline</span></button>
      <button class="navbtn" data-page="contacts"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.2 2.5-5 6-5s6 1.8 6 5"/><path d="M17 11a3 3 0 0 0 0-6m1 10c2 .6 3 2 3 4"/></svg></span><span class="navtext">Contactos</span></button>
      <button class="navbtn" data-page="pending"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="navtext">Por responder</span><span id="pendingCount" class="navcount" hidden></span></button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="connection"><span id="sideDot" class="dot"></span><span id="sideStatus">Conectando WhatsApp</span></div>
    <div class="side-foot"><button class="navbtn" data-page="settings"><span class="navicon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.3v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2H15v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></span><span class="navtext">Configuración</span></button></div>
  </aside>
  <section class="main">
    <header class="topbar">
      <div class="titleblock"><h1 id="pageTitle">Resumen</h1><p id="pageSubtitle">Tu operación de WhatsApp, organizada en un solo lugar</p></div>
      <label class="searchbox"><span>⌕</span><input id="globalSearch" placeholder="Buscar cliente o mensaje…" autocomplete="off"></label>
      <div class="top-status"><span id="topDot" class="dot"></span><span id="topStatus">Conectando</span></div>
      <div class="top-actions"><button class="iconbtn" id="refreshBtn" title="Actualizar">↻</button><button class="avatarbtn" data-page="settings" title="Configuración">SC</button></div>
    </header>
    <main id="content" class="content"></main>
  </section>
</div>
<div id="toast" class="toast"></div>
<script>
(function(){
  const socket = io();
  let state = {waStatus:'Esperando conexión…',currentQr:null,chats:[],contacts:[],unreadQuestions:[],business:{},apiConfigured:false,apiKeyCount:0,providerKeyCounts:{openai:0,gemini:0},models:{openai:'gpt-4.1-mini',gemini:'gemini-3.8-flash'},providerOrder:'openai,gemini',aiStatus:'Sin verificar'};
  const pageMeta = {
    overview:['Resumen','Tu operación de WhatsApp, organizada en un solo lugar'],
    inbox:['Bandeja','Atiende conversaciones y comparte cotizaciones'],
    pipeline:['Pipeline','Sigue cada oportunidad hasta el cierre'],
    contacts:['Contactos','Administra clientes, etapas, etiquetas y notas'],
    pending:['Por responder','Consultas que necesitan una confirmación del equipo'],
    settings:['Configuración','Personaliza el negocio, la IA y la conexión de WhatsApp']
  };
  let activePage='overview', selected=null, search='', toastTimer;
  const $ = (selector, root=document) => root.querySelector(selector);
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const initials = value => String(value || '?').trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase();
  const when = value => { if(!value)return ''; const d=new Date(Number(value)); return isNaN(d)?'':d.toLocaleString('es',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); };
  const phone = id => String(id||'').replace(/@s\.whatsapp\.net|@c\.us/g,'');
  const businessName = () => state.business.name || state.business.businessName || 'Sync Connect';
  const allChats = () => [...(state.chats||[])].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  function notify(message,isError){
    const toast=$('#toast'); toast.textContent=message; toast.className='toast show'+(isError?' error':'');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.className='toast',3200);
  }
  async function api(url,options){
    const response=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},options||{}));
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'No se pudo completar la acción.');
    return body;
  }
  function connected(){ return /conectad/i.test(state.waStatus||'') && !/desconect|reconect|sesión cerrada/i.test(state.waStatus||''); }
  function updateChrome(){
    const meta=pageMeta[activePage]||pageMeta.overview;
    $('#pageTitle').textContent=meta[0]; $('#pageSubtitle').textContent=meta[1];
    document.querySelectorAll('.navbtn[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===activePage));
    const ok=connected(); $('#topStatus').textContent=state.waStatus||'Desconectado';
    $('#sideStatus').textContent=state.waStatus||'Desconectado';
    $('#topDot').className='dot'+(ok?' ok':''); $('#sideDot').className='dot'+(ok?' ok':'');
    const count=(state.unreadQuestions||[]).length, badge=$('#pendingCount');
    badge.hidden=!count; badge.textContent=count>99?'99+':String(count);
  }
  function pageHead(title,desc,action){
    return '<div class="pagehead"><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div>'+(action||'')+'</div>';
  }
  function empty(text){return '<div class="empty-state">'+esc(text)+'</div>';}
  function qrMarkup(compact){
    if(connected()) return '<div class="qr-box"><div class="qr-placeholder">WhatsApp está conectado y listo.</div></div>';
    if(state.currentQr) return '<div class="qr-box"><img src="'+esc(state.currentQr)+'" alt="Código QR de WhatsApp"></div>';
    return '<div class="qr-box"><div class="qr-placeholder">El QR aparecerá aquí al iniciar la conexión.</div></div>';
  }
  function statusPill(){
    const ok=connected();
    return '<span class="status-pill '+(ok?'connected':'pending')+'"><span class="dot '+(ok?'ok':'')+'"></span>'+esc(state.waStatus||'Desconectado')+'</span>';
  }
  function renderOverview(){
    const chats=allChats(), contacts=state.contacts||[], pending=state.unreadQuestions||[];
    const recent=chats.slice(0,5).map(chat=>'<div class="listrow"><div class="person-avatar">'+esc(initials(chat.name))+'</div><div class="listcopy"><strong>'+esc(chat.name||phone(chat.id))+'</strong><small>'+esc(chat.messages?.at(-1)?.text||'Sin mensajes')+'</small></div><span class="rowtime">'+esc(when(chat.updatedAt))+'</span></div>').join('');
    const unknown=pending.slice(-3).reverse().map(item=>'<div class="listrow"><div class="person-avatar" style="background:#fff3e3;color:#b47724">?</div><div class="listcopy"><strong>'+esc(item.name||phone(item.jid))+'</strong><small>'+esc(item.question)+'</small></div><button class="btn small" data-open-chat="'+esc(item.jid)+'">Ver</button></div>').join('');
    const site=state.business.website?'<div class="link-preview"><strong>Enlace para compartir con clientes</strong><a href="'+esc(state.business.website)+'" target="_blank" rel="noreferrer">'+esc(state.business.website)+'</a></div>':'';
    return pageHead('Buen día, '+businessName(),'Aquí tienes el estado de tu atención y tus oportunidades.')+
      '<div class="stats">'+
        '<div class="card stat"><span class="stat-icon">◉</span><div class="statlabel">Conversaciones</div><div class="statvalue">'+chats.length+'</div><div class="statfoot">Chats recibidos</div></div>'+
        '<div class="card stat"><span class="stat-icon" style="background:#edf1ff;color:#5169d3">♙</span><div class="statlabel">Contactos CRM</div><div class="statvalue">'+contacts.length+'</div><div class="statfoot">Clientes registrados</div></div>'+
        '<div class="card stat"><span class="stat-icon" style="background:#fff4e7;color:#bb7b23">◷</span><div class="statlabel">Por responder</div><div class="statvalue">'+pending.length+'</div><div class="statfoot">Consultas para revisar</div></div>'+
        '<div class="card stat"><span class="stat-icon" style="background:'+(state.apiConfigured?'#e9f8f2':'#fff1f1')+';color:'+(state.apiConfigured?'#0a9877':'#c04e58')+'">✦</span><div class="statlabel">Asistente IA</div><div class="statvalue" style="font-size:17px;margin-top:13px">'+(state.apiConfigured?'Activo':'Configurar')+'</div><div class="statfoot">'+(state.apiKeyCount||0)+' claves guardadas</div></div>'+
      '</div>'+
      '<div class="overview-grid">'+
        '<section class="card qr-card"><div class="qr-copy"><div class="eyebrow">Conexión de WhatsApp</div>'+statusPill()+'<p class="qr-note">'+(connected()?'El CRM está enlazado con tu teléfono. Las conversaciones nuevas aparecerán en la bandeja.':'Abre WhatsApp en tu teléfono y escanea este código desde Dispositivos vinculados. El QR se muestra dentro del CRM.')+'</p><div class="quick-actions">'+(!connected()?'<button class="btn primary" data-action="connect">Conectar WhatsApp</button>':'<button class="btn" data-page="inbox">Abrir bandeja</button>')+'<button class="btn" data-page="settings">Configuración</button></div></div>'+qrMarkup(false)+'</section>'+
        '<section class="card cardpad"><div class="pagehead" style="margin:0 0 3px"><div><h3 class="cardtitle">Actividad reciente</h3><p class="carddesc">Últimas conversaciones recibidas</p></div><button class="btn small" data-page="inbox">Ver bandeja</button></div><div class="list">'+(recent||empty('Aquí aparecerán las conversaciones cuando conectes WhatsApp.'))+'</div></section>'+
        '<section class="card cardpad"><div class="pagehead" style="margin:0 0 3px"><div><h3 class="cardtitle">Necesitan seguimiento</h3><p class="carddesc">Preguntas que requieren respuesta humana</p></div><button class="btn small" data-page="pending">Ver todas</button></div><div class="list">'+(unknown||empty('No tienes consultas pendientes.'))+'</div></section>'+
        '<section class="card cardpad"><h3 class="cardtitle">Información que usa el asistente</h3><p class="carddesc">El bot responde con los datos que configures. Si no encuentra una respuesta, la deja para revisión.</p>'+site+'<div class="quick-actions" style="margin-top:12px"><button class="btn" data-page="settings">Editar información del negocio</button></div></section>'+
      '</div>';
  }
  function renderInbox(){
    const chats=allChats().filter(chat=>{
      const q=search.toLowerCase(); return !q || String(chat.name+' '+phone(chat.id)+' '+(chat.messages||[]).map(m=>m.text).join(' ')).toLowerCase().includes(q);
    });
    const list=chats.map(chat=>{
      const last=(chat.messages||[]).at(-1);
      return '<div class="chat-item '+(selected===chat.id?'active':'')+'" data-chat="'+esc(chat.id)+'"><div class="person-avatar">'+esc(initials(chat.name||phone(chat.id)))+'</div><div class="listcopy"><div class="chat-meta"><strong>'+esc(chat.name||phone(chat.id))+'</strong><small>'+esc(when(chat.updatedAt))+'</small></div><small>'+esc(last?.text||'Sin mensajes')+'</small></div></div>';
    }).join('');
    const chat=chats.find(item=>item.id===selected)||allChats().find(item=>item.id===selected);
    const messages=chat?(chat.messages||[]).map(message=>'<div class="bubble '+esc(message.from)+'">'+esc(message.text)+'<span class="bubble-time">'+esc(when(message.at))+'</span></div>').join(''):empty(state.currentQr?'Escanea el QR para empezar a recibir mensajes.':'Selecciona una conversación para ver los mensajes.');
    const customer=chat?state.contacts.find(item=>item.id===chat.id):null;
    const quoteDisabled=!chat?' disabled':'';
    return '<div class="inbox">'+
      '<section class="card chat-list-card"><div class="cardpad" style="padding:14px 14px 3px"><div class="eyebrow">WhatsApp</div><h3 class="cardtitle">Conversaciones <span style="color:#96a4b5;font-weight:500">('+allChats().length+')</span></h3></div><label class="searchbox inbox-search"><span>⌕</span><input id="inboxSearch" placeholder="Buscar chat…" value="'+esc(search)+'"></label><div class="chat-list">'+(list||empty('Todavía no hay conversaciones. Escanea el QR para conectar WhatsApp.'))+'</div></section>'+
      '<section class="card conversation-card">'+
        '<div class="conversation-head">'+(chat?'<div class="person-avatar">'+esc(initials(chat.name||phone(chat.id)))+'</div><div class="listcopy"><strong>'+esc(chat.name||phone(chat.id))+'</strong><small>'+esc(phone(chat.id))+(customer?.stage?' · '+esc(customer.stage):'')+'</small></div>':'<div class="listcopy"><strong>Asistente de atención</strong><small>Conversación de WhatsApp</small></div>')+
        (chat?'<button class="btn small '+(customer?.botPaused?'success':'')+'" data-action="toggle-bot">'+(customer?.botPaused?'Devolver al asistente':'Tomar conversación')+'</button>':'')+
        '<button class="btn small" data-action="quote"'+quoteDisabled+'>Compartir cotización</button></div>'+
        '<div class="message-area" id="messageArea">'+messages+'</div>'+
        '<div class="quickbar"><button class="btn small" data-action="share-site"'+quoteDisabled+'>↗ Compartir página web</button><button class="btn small" data-page="settings">Editar mensaje de cotización</button></div>'+
        '<form class="compose" id="sendForm"><input id="messageInput" autocomplete="off" placeholder="Escribe un mensaje…"'+quoteDisabled+'><button class="btn primary" type="submit"'+quoteDisabled+'>Enviar</button></form>'+
      '</section></div>';
  }
  const stages=['Nuevo','Contactado','Calificado','Ganado'];
  function stageOptions(current){
    return stages.map(stage=>'<option value="'+esc(stage)+'"'+(stage===(current||'Nuevo')?' selected':'')+'>'+esc(stage)+'</option>').join('');
  }
  function renderPipeline(){
    const contacts=state.contacts||[];
    const cols=stages.map(stage=>{
      const rows=contacts.filter(contact=>(contact.stage||'Nuevo')===stage);
      const cards=rows.map(contact=>{
        const chat=state.chats.find(item=>item.id===contact.id), last=chat?.messages?.at(-1);
        return '<article class="lead-card" data-open-chat="'+esc(contact.id)+'"><strong>'+esc(contact.name||phone(contact.id))+'</strong><p>'+esc(last?.text||contact.notes||phone(contact.id))+'</p><div class="lead-foot"><span class="stage-chip">'+esc(when(contact.lastMessageAt||contact.createdAt)||'Contacto')+'</span><select class="stage-select" data-stage="'+esc(contact.id)+'">'+stageOptions(contact.stage||stage)+'</select></div></article>';
      }).join('');
      return '<section class="stage-col"><div class="stage-head"><strong>'+esc(stage)+'</strong><span class="stage-count">'+rows.length+'</span></div>'+(cards||empty('Sin contactos'))+'</section>';
    }).join('');
    return pageHead('Pipeline de ventas','Organiza tus oportunidades y actualiza la etapa de cada cliente.', '<button class="btn" data-page="contacts">Ver contactos</button>')+'<div class="kanban">'+cols+'</div>';
  }
  function renderContacts(){
    const contacts=(state.contacts||[]).filter(contact=>{
      const q=search.toLowerCase(); return !q || String(contact.name+' '+phone(contact.id)+' '+(contact.tags||[]).join(' ')).toLowerCase().includes(q);
    }).sort((a,b)=>(b.lastMessageAt||0)-(a.lastMessageAt||0));
    const rows=contacts.map(contact=>{
      const chat=state.chats.find(item=>item.id===contact.id), last=chat?.messages?.at(-1);
      return '<tr><td><div class="contact-name"><span class="person-avatar">'+esc(initials(contact.name||phone(contact.id)))+'</span>'+esc(contact.name||phone(contact.id))+'</div></td><td>'+esc(phone(contact.id))+'</td><td><select class="stage-select" data-stage="'+esc(contact.id)+'">'+stageOptions(contact.stage)+'</select></td><td>'+esc((contact.tags||[]).join(', ')||'—')+'</td><td>'+esc(last?.text||'—')+'</td><td><div style="display:flex;align-items:center;gap:6px"><details class="contact-edit"><summary>Editar ficha</summary><form data-contact-form="'+esc(contact.id)+'"><input name="tags" value="'+esc((contact.tags||[]).join(', '))+'" placeholder="Etiquetas, separadas por coma"><textarea name="notes" placeholder="Notas del cliente">'+esc(contact.notes||'')+'</textarea><button class="btn small" type="submit">Guardar ficha</button></form></details><button class="btn small" data-open-chat="'+esc(contact.id)+'">Abrir</button></div></td></tr>';
    }).join('');
    return pageHead('Contactos','Los clientes que escriben por WhatsApp se guardan en tu CRM.','<button class="btn" data-page="pipeline">Abrir pipeline</button>')+
      '<section class="card" style="padding:14px"><div class="pagehead" style="margin:0 0 12px"><div><h3 class="cardtitle">Todos los contactos</h3><p class="carddesc">'+contacts.length+' clientes registrados</p></div></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Etapa</th><th>Etiquetas</th><th>Último mensaje</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">'+empty('Conecta WhatsApp y tus nuevos clientes aparecerán aquí.')+'</td></tr>')+'</tbody></table></div></section>';
  }
  function renderPending(){
    const items=[...(state.unreadQuestions||[])].reverse();
    const cards=items.map(item=>'<article class="card question-card"><div class="question-top"><div class="person-avatar" style="background:#fff3e3;color:#b47724">?</div><div class="listcopy"><strong>'+esc(item.name||phone(item.jid))+'</strong><small>'+esc(phone(item.jid))+' · '+esc(when(item.at))+'</small></div></div><p class="question-text">'+esc(item.question)+'</p><div class="question-actions"><button class="btn primary small" data-open-chat="'+esc(item.jid)+'">Responder en bandeja</button><button class="btn small" data-done="'+esc(item.id)+'">Marcar atendido</button></div></article>').join('');
    return pageHead('Preguntas por responder','El asistente no encontró la respuesta en la información configurada.')+'<div class="pending-list">'+(cards||'<section class="card">'+empty('No hay preguntas pendientes. ¡Todo al día!')+'</section>')+'</div>';
  }
  function asText(value){
    if(Array.isArray(value))return value.map(item=>typeof item==='string'?item:JSON.stringify(item)).join('\n');
    if(value&&typeof value==='object')return JSON.stringify(value,null,2);
    return String(value||'');
  }
  function renderSettings(){
    const b=state.business||{};
    const qr=qrMarkup(true);
    return pageHead('Configuración','Añade los datos reales de tu negocio y ajusta la conexión.')+
      '<div class="settings-grid">'+
      '<form id="settingsForm" class="card settings-card">'+
        '<div class="eyebrow">Base de conocimiento</div><h3 class="cardtitle">Información del negocio</h3><p class="carddesc" style="margin-bottom:14px">La IA utilizará estos datos para responder. Si falta un dato, lo marcará para que lo revise una persona.</p>'+
        '<div class="form-grid">'+
          '<div class="field"><label for="bizName">Nombre del negocio</label><input id="bizName" name="name" value="'+esc(b.name||b.businessName||'')+'" placeholder="Nombre de tu negocio"></div>'+
          '<div class="field"><label for="bizWebsite">Página web</label><input id="bizWebsite" name="website" value="'+esc(b.website||'')+'" placeholder="https://tusitio.com"></div>'+
          '<div class="field"><label for="bizDemoLink">Enlace de una demo pública</label><input id="bizDemoLink" name="demoLink" value="'+esc(b.demoLink||'')+'" placeholder="https://tusitio.com/demo"><span class="hint">Si lo configuras, el bot lo comparte de inmediato cuando alguien pide una demostración.</span></div>'+
          '<div class="field"><label for="bizHours">Horarios</label><textarea id="bizHours" name="hours" placeholder="Lunes a viernes, 9:00 a 18:00">'+esc(asText(b.hours))+'</textarea></div>'+
          '<div class="field"><label for="bizAddress">Dirección o modalidad</label><textarea id="bizAddress" name="address" placeholder="Dirección completa o servicio remoto">'+esc(asText(b.address))+'</textarea></div>'+
          '<div class="field full"><label for="bizDescription">Descripción del negocio y servicios</label><textarea class="long" id="bizDescription" name="description" placeholder="Qué haces, para quién y qué servicios ofreces…">'+esc(asText(b.description||b.services))+'</textarea></div>'+
          '<div class="field full"><label for="bizPrices">Precios y cotizaciones</label><textarea id="bizPrices" name="prices" placeholder="Productos o servicios y precios confirmados. No pongas precios que no quieras publicar.">'+esc(asText(b.prices))+'</textarea></div>'+
          '<div class="field full"><label for="bizFaqs">Preguntas frecuentes y respuestas</label><textarea class="long" id="bizFaqs" name="faqs" placeholder="Una pregunta y respuesta por línea…">'+esc(asText(b.faqs))+'</textarea></div>'+
          '<div class="field"><label for="bizPhone">Teléfono para avisos</label><input id="bizPhone" name="notificationPhone" value="'+esc(b.notificationPhone||'')+'" placeholder="+505 0000 0000"><span class="hint">Las dudas aparecen en el CRM y se envían a este WhatsApp si lo configuras.</span></div>'+
          '<div class="field"><label for="bizQuote">Mensaje al compartir la página</label><textarea id="bizQuote" name="quoteMessage" placeholder="Aquí están las cotizaciones básicas: {website}">'+esc(b.quoteMessage||'Aquí están las cotizaciones básicas: {website}')+'</textarea><span class="hint">Usa {website} donde quieras que aparezca el enlace.</span></div>'+
        '</div>'+
        '<div class="eyebrow" style="margin-top:20px">Inteligencia artificial</div><div class="form-grid">'+
          '<div class="field full"><label for="apiKeys">Claves de OpenAI</label><textarea class="keybox" id="apiKeys" name="apiKeys" placeholder="Pega una o más claves sk-…, una por línea. Las guardadas nunca se muestran aquí."></textarea><span class="hint">'+Number(state.providerKeyCounts?.openai||0)+' clave(s) guardada(s). Se intentarán antes o después de Gemini según el orden.</span></div>'+
          '<div class="field"><label for="modelName">Modelo de OpenAI</label><input id="modelName" name="model" value="'+esc(state.models?.openai||'gpt-4.1-mini')+'" placeholder="gpt-4.1-mini"></div>'+
          '<div class="field full"><label for="geminiKeys">Claves de Gemini</label><textarea class="keybox" id="geminiKeys" name="geminiKeys" placeholder="Pega una o más claves de Google AI Studio, una por línea."></textarea><span class="hint">'+Number(state.providerKeyCounts?.gemini||0)+' clave(s) guardada(s). Gemini se probará automáticamente si OpenAI falla. <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">Obtener una clave de Gemini</a></span></div>'+
          '<div class="field"><label for="geminiModelName">Modelo de Gemini</label><input id="geminiModelName" name="geminiModel" value="'+esc(state.models?.gemini||'gemini-3.8-flash')+'" placeholder="gemini-3.8-flash"></div>'+
          '<div class="field"><label for="providerOrder">Proveedor que se intenta primero</label><select id="providerOrder" name="providerOrder"><option value="openai"'+(String(state.providerOrder||'openai,gemini').startsWith('openai')?' selected':'')+'>OpenAI y luego Gemini</option><option value="gemini"'+(String(state.providerOrder||'').startsWith('gemini')?' selected':'')+'>Gemini y luego OpenAI</option></select></div>'+
          '<label class="checkbox" style="align-self:end;padding-bottom:9px"><input id="replaceKeys" type="checkbox"> Reemplazar las claves del proveedor que rellenes</label>'+
          '<div class="field full"><span class="hint" style="color:'+(String(state.aiStatus||'').match(/rechazó|crédito|límite|error/i)?'#b54444':'#607086')+'">Estado de IA: '+esc(state.aiStatus||'Sin verificar')+'. Las claves se guardan solo en este computador.</span></div>'+
        '</div>'+
        '<div class="form-actions"><span class="form-note" id="saveStatus">La configuración se guarda solo en este computador.</span><button class="btn primary" type="submit">Guardar configuración</button></div>'+
      '</form>'+
      '<div class="settings-side">'+
        '<section class="card conn-card"><div class="eyebrow">Dispositivo</div><h3 class="cardtitle">Conexión de WhatsApp</h3><p class="carddesc">Escanea el QR directamente desde el CRM, sin abrir otra ventana.</p><div style="margin-top:12px">'+statusPill()+'</div><div class="qr-wrap">'+qr+'<div class="listcopy"><strong>'+(connected()?'Dispositivo vinculado':'Vincula tu teléfono')+'</strong><small>'+(connected()?'La bandeja recibe mensajes en tiempo real.':'WhatsApp → Dispositivos vinculados → Vincular un dispositivo.')+'</small></div></div><div class="quick-actions" style="margin-top:12px">'+(!connected()?'<button class="btn primary small" data-action="connect">Mostrar / renovar QR</button>':'<button class="btn danger small" data-action="logout">Cerrar sesión</button>')+'<button class="btn small" data-action="refresh">Actualizar estado</button></div></section>'+
        '<section class="card cardpad"><div class="eyebrow">Vista previa</div><h3 class="cardtitle">Lo que compartirá el bot</h3><p class="carddesc">La página web y el mensaje se envían desde la conversación elegida.</p>'+(b.website?'<div class="link-preview"><strong>'+esc(b.name||b.businessName||'Tu negocio')+'</strong><a href="'+esc(b.website)+'" target="_blank" rel="noreferrer">'+esc(b.website)+'</a></div>':'<div class="link-preview"><strong>Aún falta el enlace</strong><span class="carddesc">Añade la página web para habilitar el envío rápido.</span></div>')+'<div class="quick-actions" style="margin-top:12px"><button class="btn small" data-page="inbox">Ir a conversaciones</button></div></section>'+
        '<section class="card cardpad"><div class="eyebrow">Privacidad local</div><div class="info-row"><span>API</span><strong>'+Number(state.apiKeyCount||0)+' clave(s), ocultas</strong></div><div class="info-row"><span>Conversaciones</span><strong>Guardadas en este computador</strong></div><div class="info-row"><span>WhatsApp</span><strong>Sesión local</strong></div></section>'+
      '</div></div>';
  }
  function render(){
    updateChrome();
    const content=$('#content');
    if(activePage==='overview')content.innerHTML=renderOverview();
    if(activePage==='inbox')content.innerHTML=renderInbox();
    if(activePage==='pipeline')content.innerHTML=renderPipeline();
    if(activePage==='contacts')content.innerHTML=renderContacts();
    if(activePage==='pending')content.innerHTML=renderPending();
    if(activePage==='settings')content.innerHTML=renderSettings();
    content.scrollTop=0;
    bindPage();
  }
  function renderPreservingFocus(){
    const active=document.activeElement,id=active&&active.id;
    const value=active&&'value'in active?active.value:null;
    const start=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
    const end=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
    render();
    if(id){const target=$('#'+id);if(target){if(value!==null)target.value=value;target.focus();if(start!==null&&typeof target.setSelectionRange==='function')target.setSelectionRange(start,end);}}
  }
  function showPage(page){
    if(!pageMeta[page])return;
    activePage=page;
    if(page==='inbox'&&!selected&&allChats().length)selected=allChats()[0].id;
    search='';
    $('#globalSearch').value='';
    render();
  }
  function openConversation(id){
    if(!id)return;
    selected=id; activePage='inbox'; search=''; $('#globalSearch').value=''; render();
  }
  function sendText(text){
    if(!selected||!text||!text.trim())return notify('Selecciona una conversación y escribe un mensaje.',true);
    socket.emit('send-manual',{jid:selected,text:text.trim()});
  }
  function sendQuote(onlyLink){
    const chat=allChats().find(item=>item.id===selected);
    if(!chat)return notify('Selecciona primero una conversación.',true);
    const website=state.business.website||'';
    if(onlyLink&&!website)return notify('Añade la página web en Configuración.',true);
    let message=onlyLink?'Aquí puedes ver nuestros servicios e información básica: {website}':(state.business.quoteMessage||'Aquí están las cotizaciones básicas: {website}');
    message=message.replaceAll('{website}',website).replaceAll('{name}',businessName()).trim();
    if(website&&!message.includes(website))message+='\n'+website;
    if(!message.trim())message=website;
    sendText(message);
    notify('Enviando el enlace al cliente…');
  }
  async function saveContact(id,patch){
    try{const result=await api('/api/contacts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(patch)});state.contacts=state.contacts.map(item=>item.id===id?result.contact:item);notify('Contacto actualizado.');render();}
    catch(error){notify(error.message,true);}
  }
  function bindPage(){
    document.querySelectorAll('#content [data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));
    document.querySelectorAll('[data-open-chat]').forEach(button=>button.addEventListener('click',()=>openConversation(button.dataset.openChat)));
    document.querySelectorAll('[data-stage]').forEach(select=>select.addEventListener('change',()=>saveContact(select.dataset.stage,{stage:select.value})));
    document.querySelectorAll('[data-contact-form]').forEach(form=>form.addEventListener('submit',event=>{
      event.preventDefault();const values=new FormData(form),tags=String(values.get('tags')||'').split(',').map(value=>value.trim()).filter(Boolean);
      saveContact(form.dataset.contactForm,{tags,notes:values.get('notes')||''});
    }));
    document.querySelectorAll('[data-done]').forEach(button=>button.addEventListener('click',async()=>{
      try{await api('/api/unknown/'+encodeURIComponent(button.dataset.done)+'/done',{method:'POST',body:'{}'});notify('Pregunta marcada como atendida.');}
      catch(error){notify(error.message,true);}
    }));
    document.querySelectorAll('[data-action="connect"]').forEach(button=>button.addEventListener('click',async()=>{
      try{await api('/api/connect',{method:'POST',body:'{}'});notify('Preparando un nuevo código QR…');}
      catch(error){notify(error.message,true);}
    }));
    document.querySelectorAll('[data-action="refresh"]').forEach(button=>button.addEventListener('click',()=>fetchState()));
    document.querySelectorAll('[data-action="logout"]').forEach(button=>button.addEventListener('click',async()=>{
      if(!confirm('¿Cerrar la sesión de WhatsApp de este CRM? Tendrás que escanear un QR para volver a vincularlo.'))return;
      try{await api('/api/logout',{method:'POST',body:'{}'});notify('Sesión cerrada.');}
      catch(error){notify(error.message,true);}
    }));
    document.querySelectorAll('[data-action="quote"]').forEach(button=>button.addEventListener('click',()=>sendQuote(false)));
    document.querySelectorAll('[data-action="share-site"]').forEach(button=>button.addEventListener('click',()=>sendQuote(true)));
    document.querySelectorAll('[data-action="toggle-bot"]').forEach(button=>button.addEventListener('click',async()=>{
      if(!selected)return;
      const contact=state.contacts.find(item=>item.id===selected),pause=!contact?.botPaused;
      await saveContact(selected,{botPaused:pause});
      notify(pause?'Tomaste la conversación. El bot dejará de responder a este cliente.':'El asistente volvió a atender esta conversación.');
    }));
    const inboxSearch=$('#inboxSearch');
    if(inboxSearch)inboxSearch.addEventListener('input',event=>{search=event.target.value;const pos=event.target.selectionStart;render();const next=$('#inboxSearch');next.focus();next.setSelectionRange(pos,pos);});
    const sendForm=$('#sendForm');
    if(sendForm)sendForm.addEventListener('submit',event=>{event.preventDefault();const input=$('#messageInput');sendText(input.value);input.value='';});
    const settingsForm=$('#settingsForm');
    if(settingsForm)settingsForm.addEventListener('submit',async event=>{
      event.preventDefault();const button=settingsForm.querySelector('[type="submit"]'),status=$('#saveStatus');
      button.disabled=true;status.textContent='Guardando…';
      const form=new FormData(settingsForm), keys=String(form.get('apiKeys')||'').split(/\r?\n/).map(value=>value.trim()).filter(Boolean);
      const business={
        name:form.get('name'),businessName:form.get('name'),website:form.get('website'),demoLink:form.get('demoLink'),
        hours:form.get('hours'),address:form.get('address'),description:form.get('description'),
        prices:form.get('prices'),faqs:form.get('faqs'),notificationPhone:form.get('notificationPhone'),
        quoteMessage:form.get('quoteMessage')
      };
      try{
        const geminiKeys=String(form.get('geminiKeys')||'').split(/\r?\n/).map(value=>value.trim()).filter(Boolean);
        const result=await api('/api/settings',{method:'PUT',body:JSON.stringify({business,providers:{openai:keys,gemini:geminiKeys},models:{openai:form.get('model'),gemini:form.get('geminiModel')},providerOrder:form.get('providerOrder'),replaceKeys:$('#replaceKeys').checked})});
        state.apiKeyCount=result.apiKeyCount;state.providerKeyCounts=result.providerKeyCounts;state.apiConfigured=result.apiKeyCount>0;
        $('#apiKeys').value='';$('#geminiKeys').value='';$('#replaceKeys').checked=false;status.textContent='Guardado en este computador.';
        notify('Configuración guardada.');render();
      }catch(error){status.textContent=error.message;notify(error.message,true);}
      finally{button.disabled=false;}
    });
  }
  async function fetchState(){
    try{const response=await fetch('/api/state');if(!response.ok)throw new Error('No se pudo actualizar el CRM.');state=await response.json();render();}
    catch(error){notify(error.message,true);}
  }
  document.querySelectorAll('#nav [data-page],.side-foot [data-page],.top-actions [data-page]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));
  $('#refreshBtn').addEventListener('click',fetchState);
  $('#globalSearch').addEventListener('input',event=>{search=event.target.value;if(activePage==='inbox'||activePage==='contacts')render();});
  socket.on('state',next=>{
    state=next;
    renderPreservingFocus();
  });
  socket.on('needs-human',item=>notify((item?.assigned?'Nuevo mensaje para atender: ':'Nueva consulta para revisar: ')+(item?.name||'cliente')));
  socket.on('action-error',payload=>notify(payload?.message||'No se pudo completar la acción.',true));
  socket.on('connect',fetchState);
  socket.on('connect_error',()=>{state.waStatus='El panel está cargado; reconectando en tiempo real…';updateChrome();});
  fetchState();
})();
</script>
</body>
</html>
